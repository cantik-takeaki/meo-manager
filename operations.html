<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>情報照合・運用管理｜ラクラクMEO</title><link rel="stylesheet" href="/assets/operations.css"></head><body class="meo-ops"><header><a href="/" aria-label="ラクラクMEOの管理画面"><img class="brand-logo" src="/assets/rakuraku-meo-official.webp" width="560" height="167" alt="ラクラクMEO"></a><span>情報照合・運用管理</span><a href="/help.html#operations">使い方</a><button id="logout" hidden>ログアウト</button></header><main><div id="notice" role="status" aria-live="polite"></div><section id="access-result" class="block" hidden><h2>ご本人へ渡すリンク</h2><p>24時間以内に開いてください。この画面を閉じるとリンクは再表示できません。</p><label>招待・再設定リンク<textarea id="access-url" readonly></textarea></label><button id="access-close">リンクを閉じる</button></section><section id="accept-access" class="block" hidden><h1>パスワードを設定</h1><p>招待されたメールアドレスと、ご自身で決めたパスワードを入力してください。</p><form id="accept-form"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>新しいパスワード<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><label>新しいパスワード（確認）<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><button>設定してログインへ</button></form></section><section id="login" hidden><h1>店舗・代理店ログイン</h1><p>契約時に登録されたメールアドレスでログインしてください。</p><form id="login-form"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button>ログイン</button></form><p>パスワードを忘れた場合は、契約責任者へ再設定リンクの発行をご依頼ください。</p><p>運営担当者は<a href="/">既存の管理画面</a>からログインできます。</p></section><section id="app" hidden><div class="heading"><div><p class="eyebrow">店舗情報を、根拠のある状態へ</p><h1>情報照合・運用管理</h1></div><button id="reload">再読み込み</button></div><div class="selectors"><label>契約・代理店<select id="tenant"></select></label><label>店舗<select id="store"></select></label></div><div id="contract"></div><nav aria-label="運用メニュー"><button data-tab="diagnosis">情報の診断</button><button data-tab="issues">掲載情報</button><button data-tab="contents">投稿・写真</button><button data-tab="metrics">実績</button><button data-tab="settings">利用者・契約</button></nav><section id="panel"></section></section></main><script src="/assets/meo-diagnostic.js"></script><script type="module" src="/assets/operations.js"></script></body></html>
