<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口コミ返信設定｜ラクラクMEO</title><style>body{max-width:44rem;margin:4rem auto;padding:1rem;font:16px/1.7 sans-serif;color:#172e49}button{font:inherit;margin:.25rem;padding:.55rem 1rem}output{display:block}</style><h1>口コミ返信設定</h1><p>自動返信の対象は、内容と文章の検査を通った星4・5の口コミです。低評価、苦情、判定が難しい口コミは確認用の下書きに入ります。</p><output id="status">読み込み中</output><button data-mode="auto">高評価の自動返信を有効にする</button><button data-mode="draft">全件を下書きにする</button><button data-mode="off">停止する</button><script>
const endpoint='/api/admin?action=review-autoreply-mode',label={auto:'高評価のみ自動返信',draft:'全件下書き',off:'停止'};
async function update(mode){const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const r=await fetch(endpoint,mode?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})}:{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'取得できませんでした');document.querySelector('output').textContent='現在の設定　'+label[data.mode];}catch(e){document.querySelector('output').textContent=e.message;}finally{buttons.forEach(b=>b.disabled=false)}}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>update(b.dataset.mode));update();
</script></html>
